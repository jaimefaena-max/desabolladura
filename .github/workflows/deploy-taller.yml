name: Publicar en taller.solucionesconia.cl (Cloudflare Pages)

# Un push a main compila la demo para la raíz del dominio y la sube al proyecto
# de Cloudflare Pages `desabolladura`. El dominio personalizado ya apunta a ese proyecto.
# Requiere dos secretos en el repositorio (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token con permiso «Cloudflare Pages: Edit» en la cuenta
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta de Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taller-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar para la raíz del dominio
        env:
          DEMO_BASE: /
          # Worker propio que consulta el registro de vehículos (la clave vive en Cloudflare, no aquí).
          VITE_API_PATENTES: https://patentes-zasa.jaime-faena.workers.dev
        run: npm run build
      - name: Publicar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.162.0 pages deploy dist --project-name=desabolladura --branch=main
